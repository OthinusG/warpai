name: Bug report
description: Report a reproducible Warpai problem.
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Existing reports
      options:
        - label: I searched https://github.com/OthinusG/warpai/issues for duplicates.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Warpai version
      description: See Settings > About; include the source commit for a development build.
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop operating system
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS version and shell
    validations:
      required: true
  - type: textarea
    id: remote
    attributes:
      label: SSH Remote or WSL environment, if applicable
      description: Include the remote OS, Companion version and connection type.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or relevant logs
      description: Remove credentials and private content before attaching evidence.
