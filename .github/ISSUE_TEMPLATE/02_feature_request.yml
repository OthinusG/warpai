name: Feature request
description: Describe a user problem and the desired Warpai behavior.
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Existing requests
      options:
        - label: I searched https://github.com/OthinusG/warpai/issues for duplicates.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain who is affected and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples and constraints
      description: Include relevant platform, terminal or SSH Remote context.
