name: Release Windows x64

on:
  workflow_run:
    workflows: ["Release Warpai macOS"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach Windows assets to (leave blank for latest release)"
        required: false
        type: string
      force_rebuild:
        description: "Force rebuild even if Windows assets already exist"
        required: false
        type: boolean
        default: false
      artifact_only:
        description: "Build from the selected branch and upload a test artifact without changing a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-windows-x64
  cancel-in-progress: false

jobs:
  build-and-release-windows:
    name: Build and release Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Determine target release and check existing assets
        id: check-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
          ARTIFACT_ONLY: ${{ github.event.inputs.artifact_only }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          AUTO_PUBLISH=false
          if [[ "$ARTIFACT_ONLY" == "true" ]]; then
            TARGET_TAG="$INPUT_TAG"
            [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
            git check-ref-format "refs/tags/$TARGET_TAG"
            echo "release_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
            echo "source_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "auto_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$INPUT_TAG" ]]; then
            TARGET_TAG="$INPUT_TAG"
          else
            if [[ -n "$SOURCE_RUN_ID" ]]; then
              gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-target --dir release-target
              if [[ -f release-target/artifact-only.txt && "$(cat release-target/artifact-only.txt)" == "true" ]]; then
                echo "Test-only macOS package; skipping Windows release packaging."
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              TARGET_TAG="$(cat release-target/release-tag.txt)"
              if [[ -f release-target/auto-publish.txt ]]; then
                AUTO_PUBLISH="$(cat release-target/auto-publish.txt)"
              fi
            else
              TARGET_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
            fi
          fi

          if [[ -z "$TARGET_TAG" ]]; then
            echo "No target release tag found."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          git check-ref-format "refs/tags/$TARGET_TAG"

          echo "Target release tag: $TARGET_TAG"
          echo "release_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "source_ref=refs/tags/$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "auto_publish=$AUTO_PUBLISH" >> "$GITHUB_OUTPUT"

          EXISTING_ASSETS="$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)"

          installer="WarpaiSetup-${TARGET_TAG#v}-windows-x64.exe"
          if echo "$EXISTING_ASSETS" | grep -Fxq "$installer" && [[ "$FORCE_REBUILD" != "true" ]]; then
            echo "Windows installer already exists on release $TARGET_TAG. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TARGET_TAG requires Windows x64 assets."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Warpai
        if: steps.check-release.outputs.should_build == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ steps.check-release.outputs.source_ref }}

      - name: Configure Windows git and environment
        if: steps.check-release.outputs.should_build == 'true'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          "CARGO_HOME=C:\cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install verified Windows protobuf compiler
        if: steps.check-release.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '36.2'
          $archive = Join-Path $env:RUNNER_TEMP "protoc-$version-win64.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP ("protoc-$version-" + [guid]::NewGuid().ToString('N'))
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3') { throw 'Protobuf compiler checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          $protoc = Join-Path $installRoot 'bin\protoc.exe'
          & $protoc --version
          if ($LASTEXITCODE -ne 0) { throw 'Protobuf compiler verification failed' }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $installRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install build tools and dependencies
        if: steps.check-release.outputs.should_build == 'true'
        shell: pwsh
        run: |
          choco install innosetup -y
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Inno Setup installation failed' }
          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          & $protoc --version
          if ($LASTEXITCODE -ne 0) { throw 'Protobuf compiler verification failed' }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          bash script/install_cargo_release_deps

      - name: Verify build toolchain
        if: steps.check-release.outputs.should_build == 'true'
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          protoc --version
          cargo-about --version
          Get-Command ISCC

      - name: Prepare Windows-owned WSL payload build
        if: steps.check-release.outputs.should_build == 'true' && hashFiles('script/companion/package-wsl.py') != ''
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-22.04
          wsl-version: 2
          set-as-default: 'false'
          wsl-shell-user: root
          additional-packages: build-essential protobuf-compiler pkg-config libssl-dev zlib1g-dev git git-lfs curl python3
      - name: Build tagged bundled WSL Companion on Windows
        if: steps.check-release.outputs.should_build == 'true' && hashFiles('script/companion/package-wsl.py') != ''
        shell: wsl-bash_Ubuntu-22.04 {0}
        run: GITHUB_ACTIONS=true bash script/verify-wsl-workspace.sh

      - name: Build and package Windows x64 artifacts
        if: steps.check-release.outputs.should_build == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.check-release.outputs.release_tag }}
        run: |
          cargo test -p warp-agent-bus --lib ssh_remote::tests --locked
          if ($LASTEXITCODE -ne 0) { throw 'SSH control socket regression failed' }
          cargo test -p warpai --lib remote_server::selected_session::ssh_tests --locked
          if ($LASTEXITCODE -ne 0) { throw 'SSH session selection regression failed' }
          cargo test -p warpai --lib wsl_selection_ --locked
          if ($LASTEXITCODE -ne 0) { throw 'Nested WSL SSH selection regression failed' }
          pwsh script/build-warpai-windows.ps1 -ReleaseTag "$env:RELEASE_TAG"

      - name: Check Windows release artifacts
        if: steps.check-release.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -lh WarpaiSetup-x64.exe Warpai-windows-x64.zip
          sha256sum WarpaiSetup-x64.exe > SHA256SUMS-windows.txt
          git rev-parse HEAD > release-source.txt

      - name: Verify Windows product version and icon
        if: steps.check-release.outputs.should_build == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.check-release.outputs.release_tag }}
        run: |
          $expected = $env:RELEASE_TAG -replace '^v', ''
          $product = (Get-Item target/x86_64-pc-windows-msvc/rlto/warpai.exe).VersionInfo
          if ($product.ProductVersion -ne $expected -or $product.FileVersion -ne $expected) { throw 'PE version mismatch' }
          $parts = $expected.Split('.')
          if ($product.FileMajorPart -ne [int]$parts[0] -or $product.FileMinorPart -ne [int]$parts[1] -or $product.FileBuildPart -ne [int]$parts[2]) { throw 'PE numeric version mismatch' }
          $installer = (Get-Item WarpaiSetup-x64.exe).VersionInfo
          Write-Host "Application: product=$($product.ProductVersion), file=$($product.FileVersion)"
          Write-Host "Installer: product=$($installer.ProductVersion), file=$($installer.FileVersion)"
          if ($installer.ProductVersion.Trim() -ne $expected) { throw 'Installer product version mismatch' }
          $icon = 'target/Warpai-portable-x64/icon.ico'
          if ((Get-FileHash $icon).Hash -ne (Get-FileHash app/assets/branding/warpai.ico).Hash) { throw 'Portable icon mismatch' }
          if (-not (Test-Path target/Warpai-portable-x64/warpai-agent.exe)) { throw 'Missing local MCP bridge' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$PWD/Warpai-windows-x64.zip")
          try {
            $names = $archive.Entries.FullName
            foreach ($name in @('Warpai.exe', 'warpai-agent.exe', 'icon.ico', 'conpty.dll', 'dxcompiler.dll', 'x64/OpenConsole.exe')) {
              if ($name -notin $names) { throw "Missing portable archive entry: $name" }
            }
          } finally { $archive.Dispose() }

      - name: Preserve Windows installer for verification
        if: steps.check-release.outputs.should_build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-installer
          path: |
            WarpaiSetup-x64.exe
            SHA256SUMS-windows.txt
            release-source.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifacts to release
        if: steps.check-release.outputs.should_build == 'true' && github.event.inputs.artifact_only != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.check-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          installer="WarpaiSetup-${RELEASE_TAG#v}-windows-x64.exe"
          checksums="SHA256SUMS-Warpai-${RELEASE_TAG#v}-windows-x64.txt"
          cp WarpaiSetup-x64.exe "$installer"
          sha256sum "$installer" > "$checksums"
          gh release upload "$RELEASE_TAG" \
            "$installer" \
            "$checksums" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish complete release when requested
        if: steps.check-release.outputs.should_build == 'true' && github.event.inputs.artifact_only != 'true' && steps.check-release.outputs.auto_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.check-release.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

      - name: Record target for the independent Linux workflow
        if: steps.check-release.outputs.should_build == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check-release.outputs.release_tag }}
          ARTIFACT_ONLY: ${{ github.event.inputs.artifact_only == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p linux-release-target
          printf '%s\n' "$RELEASE_TAG" > linux-release-target/release-tag.txt
          printf '%s\n' "$ARTIFACT_ONLY" > linux-release-target/artifact-only.txt
          git rev-parse HEAD > linux-release-target/source-sha.txt

      - name: Preserve Linux release handoff
        if: steps.check-release.outputs.should_build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-release-target
          path: linux-release-target/
          if-no-files-found: error
          retention-days: 7
