name: Release Warpai Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semantic release tag or test package version'
        required: true
        type: string
      artifact_only:
        description: 'Build test artifacts without changing a GitHub release'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Release Windows x64"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-linux-${{ github.ref }}-${{ inputs.release_tag }}-${{ inputs.artifact_only }}
  cancel-in-progress: false

jobs:
  target:
    name: Resolve independent Linux release target
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      source: ${{ steps.target.outputs.source }}
      artifact_only: ${{ steps.target.outputs.artifact_only }}
      build: ${{ steps.target.outputs.build }}
    steps:
      - name: Read and validate release handoff
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_ONLY: ${{ inputs.artifact_only }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "linux-release-target" and .expired == false)] | length')
            if [[ "$count" == 0 ]]; then
              echo 'Windows did not build a package; skipping Linux.'
              exit 0
            fi
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name linux-release-target --dir release-target
            RELEASE_TAG=$(cat release-target/release-tag.txt)
            ARTIFACT_ONLY=$(cat release-target/artifact-only.txt)
            SOURCE_SHA=$(cat release-target/source-sha.txt)
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_ONLY" == true || "$ARTIFACT_ONLY" == false ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_only=$ARTIFACT_ONLY" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"

  build:
    needs: target
    if: needs.target.outputs.build == 'true'
    name: Linux ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:bullseye
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.target.outputs.tag }}
      WINDOWS_SOURCE: ${{ github.event_name == 'workflow_run' && needs.target.outputs.source || '' }}
      WARPAI_WORKSPACE: ${{ github.workspace }}
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
      CARGO_BUILD_RUSTFLAGS: '-C symbol-mangling-version=v0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Prepare glibc 2.31 build environment
        run: |
          # Bullseye is archived; retain signature checks while accepting historical metadata.
          printf '%s\n' \
            'deb [check-valid-until=no] http://archive.debian.org/debian bullseye main' \
            'deb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git git-lfs build-essential clang cmake pkg-config \
            libssl-dev libfreetype6-dev libfontconfig1-dev libexpat1-dev libasound2-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev libxcursor-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers \
            protobuf-compiler libprotobuf-dev python3 python3-yaml rpm libarchive-tools zstd xz-utils \
            file patchelf desktop-file-utils xvfb xauth x11-utils xdotool imagemagick \
            dbus-x11 fonts-dejavu-core fonts-noto-cjk
          [[ "$(getconf GNU_LIBC_VERSION)" == 'glibc 2.31' ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.target.outputs.artifact_only == 'true' && needs.target.outputs.source || format('refs/tags/{0}', needs.target.outputs.tag) }}
          fetch-depth: 0
          lfs: true
      - name: Verify release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "$WINDOWS_SOURCE" ]]; then
            checkout_root="$(pwd -P)"
            actual_source="$(git -c safe.directory="$checkout_root" -C "$WARPAI_WORKSPACE" rev-parse HEAD)"
            if [[ "$actual_source" != "$WINDOWS_SOURCE" ]]; then
              echo 'Windows/Linux source mismatch' >&2
              exit 1
            fi
          fi
      - name: Restore native Linux Rust outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /github/home/.cargo
            /github/home/.rustup
            target
          key: linux-bullseye-${{ matrix.arch }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            linux-bullseye-${{ matrix.arch }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Install pinned Rust and packaging tools
        run: |
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/warpai-rustup.sh"
            sh "$RUNNER_TEMP/warpai-rustup.sh" -y --profile minimal --default-toolchain 1.92.0
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.92.0 --profile minimal
          if [[ "$(cargo-about --version 2>/dev/null || true)" != 'cargo-about 0.8.4' ]]; then
            cargo install cargo-about --version 0.8.4 --locked
          fi
          bash "$WARPAI_WORKSPACE/script/linux/install_linuxdeploy"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and verify all four native package formats
        env:
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          bash "$WARPAI_WORKSPACE/script/build-warpai-linux.sh" "$RELEASE_TAG"
          echo "LINUX_PACKAGE_PREFIX=Warpai-${RELEASE_TAG#v}-linux-$ASSET_ARCH" >> "$GITHUB_ENV"
      - name: Verify installed desktop starts under X11
        env:
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          apt-get install -y "$WARPAI_WORKSPACE/target/release/bundle/linux/Warpai-${RELEASE_TAG#v}-linux-$ASSET_ARCH.deb"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            python3 "$WARPAI_WORKSPACE/script/linux/smoke.py" /opt/warpai/warpai "$WARPAI_WORKSPACE/target/linux-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-linux-${{ matrix.arch }}
          path: |
            target/release/bundle/linux/${{ env.LINUX_PACKAGE_PREFIX }}.*
            target/release/bundle/linux/manifest-linux-${{ matrix.arch }}.json
            target/release/bundle/linux/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
      - name: Upload Linux desktop smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Warpai-desktop-smoke-linux-${{ matrix.arch }}
          path: target/linux-smoke
          if-no-files-found: warn

  attach:
    name: Attach Linux packages to the existing release
    if: needs.target.outputs.artifact_only == 'false'
    needs: [target, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ format('refs/tags/{0}', needs.target.outputs.tag) }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Warpai-linux-*
          merge-multiple: true
          path: linux-release
      - name: Verify provenance, checksums and existing target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.target.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/warpai-release.json"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'warpai-release.json').read_text())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          output = Path('linux-release')
          expected = set()
          for arch in ['x64', 'arm64']:
              manifest_name = f'manifest-linux-{arch}.json'
              manifest = json.loads((output / manifest_name).read_text())
              if manifest['source'] != source or manifest['release'] != os.environ['RELEASE_TAG']:
                  raise SystemExit('Linux package source/tag mismatch')
              prefix = f"Warpai-{os.environ['RELEASE_TAG'][1:]}-linux-{arch}"
              names = {prefix + '.' + suffix for suffix in ['deb', 'rpm', 'pkg.tar.zst', 'AppImage']}
              if set(manifest['packages']) != names:
                  raise SystemExit('Incomplete Linux architecture package set')
              for name, digest in manifest['packages'].items():
                  if hashlib.sha256((output / name).read_bytes()).hexdigest() != digest:
                      raise SystemExit('Linux package checksum mismatch')
              expected.update(names | {manifest_name, f'SHA256SUMS-linux-{arch}.txt'})
          if {path.name for path in output.iterdir()} != expected:
              raise SystemExit('Unexpected Linux release files')
          if expected & {asset['name'] for asset in release['assets']}:
              raise SystemExit('Refusing to overwrite existing Linux release assets')
          PY
          gh release upload "$RELEASE_TAG" linux-release/*
